<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 150 150"
  role="img"
  aria-label="ZETA"
>
  <defs>
    <linearGradient id="zetaGradient" x1="20" y1="18" x2="132" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>

    <filter id="zetaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="150" height="150" rx="34" fill="#08070d"/>

  <rect
    x="20"
    y="20"
    width="110"
    height="110"
    rx="30"
    fill="url(#zetaGradient)"
    filter="url(#zetaGlow)"
  />

  <rect
    x="21"
    y="21"
    width="108"
    height="108"
    rx="29"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.16"
  />

  <text
    x="75"
    y="99"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="74"
    font-weight="900"
    fill="#ffffff"
    transform="skewX(-5)"
  >
    Z
  </text>
</svg>
